name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python Tests ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python tests (unit tests — no Docker required)
        run: python -m pytest tests/ -v --tb=short --ignore=tests/test_orchestrator.py

      - name: Set up Docker for integration tests
        uses: docker/setup-buildx-action@v3

      - name: Build sandbox image (needed for orchestrator integration tests)
        run: docker build --target sandbox -t agira/sandbox:latest .

      - name: Run orchestrator integration tests
        env:
          AGIRA_SANDBOX_MODE: docker
        run: python -m pytest tests/test_orchestrator.py -v --tb=short

  # ── Frontend TypeScript + Build ───────────────────────────────────────────
  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── Docker Build + Push (all 3 images on merge to main) ───────────────────
  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push sandbox image (SECURITY CRITICAL — isolated execution)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: sandbox
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/sandbox:${{ github.sha }}
            ghcr.io/${{ github.repository }}/sandbox:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security Scanning (Trivy + Semgrep + CodeQL) ─────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Trivy: FS vulnerability scan → SARIF → GitHub Security tab
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
          category: trivy

      # Semgrep: SAST for secrets + security anti-patterns
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >
            p/security-audit
            p/secrets

      # CodeQL: static analysis for Python code
      - name: Initialize CodeQL
        uses: github/codeql-action/init-action@v3
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze-action@v3
        with:
          category: "/language:python"

  # ── Deploy to Production (manual workflow_dispatch) ──────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'workflow_dispatch'
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via rsync + docker compose
        env:
          HOST: ${{ vars.PRODUCTION_HOST }}
          USER: ${{ vars.PRODUCTION_USER }}
        run: |
          echo "Deploying to $USER@$HOST..."
          rsync -av --delete \
            --exclude='node_modules' \
            --exclude='.venv' \
            --exclude='.pytest_cache' \
            --exclude='.next' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -e "ssh -o StrictHostKeyChecking=no" \
            . $USER@$HOST:/opt/agira/
          ssh $USER@$HOST " \
            cd /opt/agira && \
            IMAGE_TAG=${{ github.sha }} && \
            docker compose -f docker-compose.yml pull && \
            docker compose -f docker-compose.yml up -d --pull always && \
            docker image prune -f \
          "
          echo "✓ Deployment complete"
          echo "✓ Frontend: https://$HOST:3000"
          echo "✓ Health:   https://$HOST:3000/api/health"