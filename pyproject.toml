[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agira"
version = "0.1.0"
description = "Autonomous GitHub Repo Intelligence & Repair Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
agira = "agira.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agira*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
